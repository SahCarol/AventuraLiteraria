<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Casmurro - Aventura Interativa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3c2c 0%, #2a1a0e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: #fdf6e3;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #d4a373;
        }

        .header {
            background: #2c1810;
            color: #f0d8a8;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #d4a373;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
            font-style: italic;
        }

        .scene-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #3a2a1a, #1a0f05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4a373;
            font-size: 4rem;
            border-bottom: 1px solid #d4a373;
        }

        .content {
            padding: 30px;
        }

        .story-text {
            background: #fff8ed;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 5px solid #d4a373;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #2c1810;
            min-height: 200px;
        }

        .choices-area {
            margin-bottom: 25px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            background: #e8dcc8;
            border: 2px solid #c4a47c;
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 30px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: #2c1810;
        }

        .choice-btn:hover {
            background: #d4a373;
            border-color: #8b5e3c;
            color: white;
            transform: translateX(5px);
        }

        .reset-btn {
            background: #2c1810;
            color: #f0d8a8;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #4a2a1a;
            transform: scale(1.02);
        }

        .footer {
            background: #2c1810;
            color: #a08060;
            padding: 15px;
            text-align: center;
            font-size: 0.8rem;
            border-top: 1px solid #d4a373;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>📖 Dom Casmurro</h1>
            <p>Uma aventura interativa por Machado de Assis</p>
        </div>
        <div class="scene-image">
            ⛪ 🏠 💔
        </div>
        <div class="content">
            <div class="story-text" id="storyText">
                Carregando...
            </div>
            <div class="choices-area" id="choicesArea">
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Recomeçar Jornada</button>
        </div>
        <div class="footer">
            Baseado na obra-prima de Machado de Assis | "Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria."
        </div>
    </div>

    <script>
        // Definição dos nós da aventura
        const gameNodes = {
            // Nó inicial
            start: {
                text: "🌅 Rio de Janeiro, 1857. Você é Bento Santiago, Bentinho. Sua mãe, D. Glória, fez uma promessa religiosa: você seria padre. Mas seu coração pertence a Capitu, a menina de olhos oblíquos e dissimulados da vizinha. <br><br> Aos 15 anos, você descobre que sua mãe mandou sua amada para um colégio interno, tentando afastá-los. O que fazer?",
                image: "⛪",
                choices: [
                    { text: "💔 Visitar Capitu escondido no colégio", nextNode: "visit_capitu" },
                    { text: "🙏 Aceitar o destino e entrar para o seminário", nextNode: "accept_seminary" },
                    { text: "🗣️ Confrontar sua mãe e pedir para casar", nextNode: "confront_mother" }
                ]
            },
            
            // Ramo 1: Visitar Capitu
            visit_capitu: {
                text: "Você escala o muro do colégio Santa Teresa. Capitu aparece na janela, com seus olhos de cigana oblíqua. 'Bentinho, você é um louco!' Ela sorri, mas há um brilho calculista em seu olhar. <br><br> Capitu propõe um plano: você deve fingir que vai ser padre por um tempo, enquanto ela convence sua mãe. 'Confie em mim', ela sussurra. Mas algo na sua voz te faz hesitar...",
                choices: [
                    { text: "✨ Aceitar o plano de Capitu", nextNode: "accept_capitu_plan" },
                    { text: "⚠️ Desconfiar e perguntar suas verdadeiras intenções", nextNode: "distrust_capitu" },
                    { text: "🏃 Fugir com Capitu agora mesmo", nextNode: "elope_with_capitu" }
                ]
            },
            
            accept_capitu_plan: {
                text: "Você topa o plano. Por anos, frequenta o seminário, enquanto Capitu te espera. Finalmente, D. Glória libera vocês para casar. Casam-se, têm filhos. Mas um dia, Ezequiel nasce... e começa a parecer com Escobar, seu melhor amigo. <br><br> A dúvida te corrói: seria Capitu infiel? O que fazer?",
                choices: [
                    { text: "🔍 Investigar secretamente", nextNode: "investigate" },
                    { text: "💀 Confrontar Capitu diretamente", nextNode: "confront_capitu" },
                    { text: "📝 Escrever um livro sobre sua dor", nextNode: "write_book" }
                ]
            },
            
            distrust_capitu: {
                text: "Você questiona Capitu. Ela chora, diz que você não confia nela. 'Os olhos de ressaca, Bentinho... Você nunca entendeu o que eles dizem.' Elsome afasta. Anos depois, ela se casa com outro. Você se torna um homem amargo, solitário, que constrói um casarão idêntico ao da infância, tentando reviver o passado. <br><br> Dom Casmurro: você olha para o passado e não se reconhece.",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            elope_with_capitu: {
                text: "Capitu nega. 'Você é louco, Bentinho!' Ela some na noite. Você volta para casa, derrotado. Sua mãe te manda para a Europa por dois anos. Ao voltar, descobre que Capitu teve um filho de outro. O ciúme te consome. Você passa o resto da vida sozinho, escrevendo memórias para tentar entender o que aconteceu. <br><br> FIM - A solidão de um homem desconfiado.",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            // Investigar (final ambíguo)
            investigate: {
                text: "Você investiga em segredo. Marca semelhanças entre Ezequiel e Escobar, mas não há provas. Capitu percebe sua frieza e definha lentamente. Ezequiel morre jovem, tentando imitar Escobar. Você fica só, com a dúvida eterna. Será que imaginou tudo? <br><br> 'Também não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria.'",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            confront_capitu: {
                text: "Você acusa Capitu. Ela nega com veemência, mas seus olhos oblíquos parecem fugir. Antes que possa provar algo, Capitu morre de tristeza. Ezequiel, órfão, parte para a Europa e também morre. Você termina como Dom Casmurro: um homem que matou com as palavras o que não pude provar com fatos.",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            write_book: {
                text: "Você decide escrever suas memórias. Chama o livro de 'Dom Casmurro'. Destila sua dúvida em cada página, transformando Capitu no grande mistério da literatura brasileira. Leitores por gerações vão debater: Capitu traiu ou não? <br><br> Você, Bentinho, morre com a mesma dúvida. Mas a obra fica eterna. FIM - A imortalidade da dúvida.",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            // Ramo aceitar seminário
            accept_seminary: {
                text: "Você aceita seu destino. Torna-se padre, mas carrega um vazio no peito. Capitu casa com outro, mas continua sua vizinha. Anos depois, você a reencontra no jardim da Glória. Seus olhos dizem tudo que não foi vivido. <br><br> Você sai andando, murmurando: 'Palavra puxa palavra, uma ideia traz outra, e assim fazemos um livro, um governo ou uma revolução.' Mas você não fez nada.",
                choices: [
                    { text: "📖 Recomeçar jornada", nextNode: "start" }
                ]
            },
            
            // Ramo confrontar mãe
            confront_mother: {
                text: "D. Glória chora, lembra da promessa a Deus. 'Você quer matar sua mãe?' Capitu intervém: 'Deixe ele fazer o que quiser, senhora. Eu espero.' Sua mãe cede. Vocês casam. <br><br> Mas a felicidade dura pouco. Quando Ezequiel nasce, parecido com Escobar, a dúvida começa. Você vive entre o ciúme e o amor, até que um dia...",
                choices: [
                    { text: "🔍 Seguir caminho da investigação", nextNode: "investigate" },
                    { text: "💀 Seguir caminho do confronto", nextNode: "confront_capitu" }
                ]
            }
        };

        let currentNode = "start";

        // Elementos do DOM
        const storyTextEl = document.getElementById("storyText");
        const choicesAreaEl = document.getElementById("choicesArea");
        const resetBtn = document.getElementById("resetBtn");
        const sceneImageEl = document.querySelector(".scene-image");

        // Função para atualizar a interface
        function updateGame() {
            const node = gameNodes[currentNode];
            if (!node) {
                currentNode = "start";
                updateGame();
                return;
            }

            // Aplicar animação
            storyTextEl.classList.remove("fade-in");
            void storyTextEl.offsetWidth; // Forçar reflow
            storyTextEl.classList.add("fade-in");
            
            // Atualizar texto
            storyTextEl.innerHTML = node.text;
            
            // Atualizar imagem/ícone
            if (node.image) {
                sceneImageEl.innerHTML = node.image;
            } else {
                sceneImageEl.innerHTML = "📖";
            }
            
            // Atualizar botões de escolha
            choicesAreaEl.innerHTML = "";
            
            if (node.choices && node.choices.length > 0) {
                node.choices.forEach((choice, index) => {
                    const btn = document.createElement("button");
                    btn.className = "choice-btn";
                    btn.innerHTML = choice.text;
                    btn.addEventListener("click", () => {
                        if (gameNodes[choice.nextNode]) {
                            currentNode = choice.nextNode;
                            updateGame();
                        } else {
                            console.error("Nó não encontrado:", choice.nextNode);
                        }
                    });
                    choicesAreaEl.appendChild(btn);
                });
            } else {
                // Caso de segurança: se não há escolhas, mostrar botão de reset
                const resetChoiceBtn = document.createElement("button");
                resetChoiceBtn.className = "choice-btn";
                resetChoiceBtn.innerHTML = "📖 Recomeçar jornada";
                resetChoiceBtn.addEventListener("click", () => {
                    currentNode = "start";
                    updateGame();
                });
                choicesAreaEl.appendChild(resetChoiceBtn);
            }
        }

        // Reset do jogo
        function resetGame() {
            currentNode = "start";
            updateGame();
        }

        // Event listeners
        resetBtn.addEventListener("click", resetGame);
        
        // Iniciar jogo
        updateGame();
    </script>
</body>
</html>
