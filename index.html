<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dom Casmurro - Aventura Interativa</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="game-container">
        <header class="header">
            <div class="header-decoration">✦</div>
            <h1>📖 Dom Casmurro</h1>
            <p>Uma aventura interativa por Machado de Assis</p>
            <div class="header-decoration">✦</div>
        </header>

        <div class="scene-image" id="sceneImage">
            <span class="scene-icon">⛪</span>
            <span class="scene-icon">🏠</span>
            <span class="scene-icon">💔</span>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <main class="content">
            <div class="story-text" id="storyText">Carregando...</div>
            
            <div class="choices-area" id="choicesArea"></div>
            
            <div class="action-buttons">
                <button class="reset-btn" id="resetBtn">🔄 Recomeçar Jornada</button>
                <button class="history-btn" id="historyBtn" style="display:none;">↩️ Voltar</button>
            </div>
        </main>

        <footer class="footer">
            <p>Baseado na obra-prima de Machado de Assis</p>
            <p class="footer-quote">"Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria."</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
