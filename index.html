<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- ===== TAGS PARA DISCORD / REDES SOCIAIS ===== -->
    <meta property="og:title" content="Dom Casmurro - Aventura Interativa" />
    <meta property="og:description" content="Uma aventura interativa por Machado de Assis. Descubra os mistérios de Capitu!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seu-site.com" />
    <meta property="og:image" content="https://seu-site.com/imagem-preview.jpg" />
    <meta name="theme-color" content="#d4a373" />
    
    <title>Dom Casmurro - Aventura Interativa</title>
    <link rel="stylesheet" href="style.css" />
    
    <style>
        /* ===== ESTILOS DE EMERGÊNCIA PARA CARREGAMENTO RÁPIDO ===== */
        /* Isso garante que o título apareça mesmo se o CSS externo falhar */
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }
        .game-container {
            max-width: 880px;
            width: 100%;
            background: #1e1613;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(212, 163, 115, 0.12);
        }
        .header {
            padding: 30px 30px 20px;
            background: linear-gradient(180deg, #221a16 0%, #16100c 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 163, 115, 0.08);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .header-icon {
            font-size: 1.8rem;
            opacity: 0.35;
        }
        .header h1 {
            font-family: 'Georgia', serif;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #f7e8c8 0%, #e8c87a 15%, #f5d99a 30%, #d4a84a 45%, #f5d99a 55%, #e8c87a 70%, #c8a04a 85%, #f7e8c8 100%);
            background-size: 100% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(180,130,50,0.4)) drop-shadow(0 4px 12px rgba(180,130,50,0.2));
            animation: goldMetallic 5s ease-in-out infinite;
        }
        @keyframes goldMetallic {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
        }
        .subtitle {
            color: rgba(180, 150, 120, 0.5);
            font-size: 1rem;
            font-style: italic;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        .header-line {
            width: 120px;
            height: 2px;
            margin: 16px auto 0;
            background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.3), transparent);
            border-radius: 2px;
        }
        .content {
            padding: 28px 32px 26px;
            background: #1e1613;
        }
        .story-text {
            background: linear-gradient(145deg, #281e18, #1e1613);
            padding: 30px 32px;
            border-radius: 16px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #e0d4c8;
            min-height: 200px;
            border-left: 4px solid rgba(212, 163, 115, 0.25);
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.4);
        }
        .choice-btn {
            width: 100%;
            padding: 15px 22px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #281e18, #1e1613);
            border: 1px solid rgba(212, 163, 115, 0.10);
            border-radius: 12px;
            color: #d4c4b0;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
        }
        .choice-btn:hover {
            border-color: rgba(212, 163, 115, 0.25);
            transform: translateX(6px);
            background: linear-gradient(135deg, #32261e, #221a16);
            color: #ece0d4;
        }
        .reset-btn {
            padding: 13px 26px;
            background: linear-gradient(135deg, #322018, #1e1210);
            color: rgba(212, 163, 115, 0.6);
            border: 1px solid rgba(212, 163, 115, 0.06);
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #3e281e, #2c1a14);
            border-color: rgba(212, 163, 115, 0.15);
            color: rgba(212, 163, 115, 0.85);
            transform: translateY(-2px);
        }
        .footer {
            padding: 22px 30px 18px;
            background: linear-gradient(0deg, #100c0a, #1a1210);
            border-top: 1px solid rgba(212, 163, 115, 0.04);
            text-align: center;
            color: rgba(180, 150, 120, 0.25);
            font-size: 0.8rem;
        }
        .footer-quote {
            color: rgba(180, 150, 120, 0.12);
            font-size: 0.75rem;
            font-style: italic;
            margin-top: 6px;
        }
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.6rem !important;
                letter-spacing: 3px !important;
            }
            .content {
                padding: 14px 12px;
            }
            .story-text {
                padding: 16px 14px;
                font-size: 0.92rem;
                min-height: 130px;
            }
            .choice-btn {
                padding: 11px 14px;
                font-size: 0.85rem;
            }
            .reset-btn {
                padding: 11px 14px;
                font-size: 0.85rem;
                width: 100%;
            }
            .header {
                padding: 18px 14px 12px;
            }
            .header-icon {
                font-size: 1.2rem;
            }
            .subtitle {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="header">
            <div class="header-top">
                <span class="header-icon">📖</span>
                <h1>Dom Casmurro</h1>
                <span class="header-icon">📖</span>
            </div>
            <p class="subtitle">Uma aventura interativa por Machado de Assis</p>
            <div class="header-line"></div>
        </header>

        <div class="scene-image" id="sceneImage">
            <div class="scene-overlay"></div>
            <div class="scene-content" id="sceneContent">
                <span class="scene-icon">⛪</span>
                <span class="scene-icon">🏠</span>
                <span class="scene-icon">💔</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-label">Progresso da História</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <main class="content">
            <div class="story-text" id="storyText">Carregando...</div>
            
            <div class="choices-area" id="choicesArea"></div>
            
            <div class="action-buttons">
                <button class="btn btn-reset" id="resetBtn">
                    <span class="btn-icon">🔄</span> Recomeçar
                </button>
                <button class="btn btn-back" id="historyBtn" style="display:none;">
                    <span class="btn-icon">↩️</span> Voltar
                </button>
            </div>
        </main>

        <footer class="footer">
            <p class="footer-text">Baseado na obra-prima de Machado de Assis</p>
            <p class="footer-quote">"Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria."</p>
            <div class="footer-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
    </html>
