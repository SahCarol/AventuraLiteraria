<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dom Casmurro - Aventura Interativa</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>📖 Dom Casmurro</h1>
            <p>Uma aventura interativa por Machado de Assis</p>
        </header>

        <div class="scene-image" id="sceneImage">⛪ 🏠 💔</div>

        <main class="content">
            <div class="story-text" id="storyText">Carregando...</div>
            <div class="choices-area" id="choicesArea"></div>
            <button class="reset-btn" id="resetBtn">🔄 Recomeçar Jornada</button>
        </main>

        <footer class="footer">
            Baseado na obra-prima de Machado de Assis<br />
            <span>"Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria."</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
