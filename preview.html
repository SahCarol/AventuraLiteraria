<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview - Dom Casmurro</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== CONTAINER DA IMAGEM ===== */
        .preview-container {
            width: 1200px;
            height: 630px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            position: relative;
            overflow: hidden;
        }

        /* ===== FUNDO COM EFEITO ===== */
        .preview-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(60, 40, 30, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(40, 70, 50, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(60, 40, 30, 0.3) 0%, transparent 50%);
            z-index: 1;
        }

        /* ===== PADRÃO DE FUNDO ===== */
        .preview-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(212, 163, 115, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(212, 163, 115, 0.02) 0%, transparent 50%);
            z-index: 1;
        }

        /* ===== CONTEÚDO ===== */
        .preview-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 90%;
        }

        /* ===== ÍCONES DECORATIVOS ===== */
        .preview-icons {
            font-size: 3.5rem;
            letter-spacing: 20px;
            margin-bottom: 20px;
            opacity: 0.6;
            filter: drop-shadow(0 4px 20px rgba(212, 163, 115, 0.2));
        }

        /* ===== TÍTULO DOURADO METÁLICO ===== */
        .preview-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 12px;
            margin-bottom: 12px;
            
            /* Gradiente dourado metálico */
            background: linear-gradient(
                180deg,
                #f7e8c8 0%,
                #e8c87a 15%,
                #f5d99a 30%,
                #d4a84a 45%,
                #f5d99a 55%,
                #e8c87a 70%,
                #c8a04a 85%,
                #f7e8c8 100%
            );
            background-size: 100% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* Brilho */
            filter: drop-shadow(0 2px 8px rgba(180, 130, 50, 0.5))
                   drop-shadow(0 4px 20px rgba(180, 130, 50, 0.25))
                   drop-shadow(0 8px 40px rgba(180, 130, 50, 0.1));
            
            animation: goldShine 4s ease-in-out infinite;
        }

        @keyframes goldShine {
            0%, 100% {
                background-position: 0% 0%;
                filter: drop-shadow(0 2px 8px rgba(180, 130, 50, 0.5))
                       drop-shadow(0 4px 20px rgba(180, 130, 50, 0.25))
                       drop-shadow(0 8px 40px rgba(180, 130, 50, 0.1));
            }
            50% {
                background-position: 0% 100%;
                filter: drop-shadow(0 2px 12px rgba(180, 130, 50, 0.8))
                       drop-shadow(0 4px 30px rgba(180, 130, 50, 0.4))
                       drop-shadow(0 8px 60px rgba(180, 130, 50, 0.2));
            }
        }

        /* ===== SUBTÍTULO ===== */
        .preview-subtitle {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.4rem;
            font-style: italic;
            color: rgba(200, 170, 140, 0.6);
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        /* ===== LINHA DECORATIVA ===== */
        .preview-line {
            width: 180px;
            height: 2px;
            margin: 0 auto 25px;
            background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.4), transparent);
            border-radius: 2px;
        }

        /* ===== CITAÇÃO ===== */
        .preview-quote {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1rem;
            font-style: italic;
            color: rgba(160, 128, 96, 0.25);
            letter-spacing: 1px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== RODAPÉ DECORATIVO ===== */
        .preview-footer {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .preview-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(212, 163, 115, 0.1);
        }

        .preview-dot:nth-child(2) {
            background: rgba(212, 163, 115, 0.2);
            width: 8px;
            height: 8px;
        }

        /* ============================================================
           📱 RESPONSIVIDADE PARA VISUALIZAÇÃO
           ============================================================ */
        @media (max-width: 1200px) {
            .preview-container {
                width: 100%;
                height: auto;
                aspect-ratio: 1200/630;
                padding: 20px;
            }
            
            .preview-title {
                font-size: clamp(2rem, 8vw, 4.5rem);
                letter-spacing: clamp(4px, 2vw, 12px);
            }
            
            .preview-subtitle {
                font-size: clamp(0.8rem, 2vw, 1.4rem);
            }
            
            .preview-icons {
                font-size: clamp(1.5rem, 4vw, 3.5rem);
            }
            
            .preview-quote {
                font-size: clamp(0.7rem, 1.2vw, 1rem);
            }
            
            .preview-line {
                width: clamp(100px, 20vw, 180px);
            }
        }

        @media (max-width: 600px) {
            .preview-container {
                padding: 15px;
            }
            
            .preview-title {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
                letter-spacing: clamp(2px, 1.5vw, 6px);
            }
            
            .preview-subtitle {
                font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            }
            
            .preview-icons {
                font-size: clamp(1.2rem, 3vw, 2rem);
                letter-spacing: 10px;
            }
            
            .preview-quote {
                font-size: clamp(0.5rem, 1vw, 0.7rem);
            }
            
            .preview-line {
                width: clamp(60px, 15vw, 100px);
            }
        }
    </style>
</head>
<body>
    <!-- ============================================================
         IMAGEM DE PREVIEW - 1200x630
         ============================================================ -->
    <div class="preview-container" id="previewImage">
        <div class="preview-content">
            <!-- Ícones -->
            <div class="preview-icons">⛪ 🏠 💔</div>
            
            <!-- Título -->
            <h1 class="preview-title">Dom Casmurro</h1>
            
            <!-- Subtítulo -->
            <p class="preview-subtitle">Uma aventura interativa</p>
            
            <!-- Linha -->
            <div class="preview-line"></div>
            
            <!-- Citação -->
            <p class="preview-quote">
                "Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria."
            </p>
            
            <!-- Rodapé -->
            <div class="preview-footer">
                <span class="preview-dot"></span>
                <span class="preview-dot"></span>
                <span class="preview-dot"></span>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPT PARA GERAR A IMAGEM
         ============================================================ -->
    <script>
        // Aguarda o DOM carregar completamente
        document.addEventListener('DOMContentLoaded', function() {
            
            // ===== FUNÇÃO PARA GERAR A IMAGEM =====
            function generatePreview() {
                const container = document.getElementById('previewImage');
                
                // Usa html2canvas para capturar a imagem
                // (biblioteca carregada via CDN)
                if (typeof html2canvas !== 'undefined') {
                    html2canvas(container, {
                        width: 1200,
                        height: 630,
                        scale: 2, // Alta qualidade
                        useCORS: true,
                        backgroundColor: '#0a0a0a',
                        allowTaint: true,
                        logging: false
                    }).then(function(canvas) {
                        // Converte para link de download
                        const link = document.createElement('a');
                        link.download = 'preview.jpg';
                        link.href = canvas.toDataURL('image/jpeg', 0.95);
                        link.click();
                    }).catch(function(error) {
                        console.error('Erro ao gerar imagem:', error);
                        alert('Erro ao gerar imagem. Verifique o console para mais detalhes.');
                    });
                } else {
                    alert('Biblioteca html2canvas não carregada. Tentando carregar...');
                    // Tenta carregar a biblioteca
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    script.onload = function() {
                        generatePreview();
                    };
                    document.head.appendChild(script);
                }
            }

            // ===== ADICIONA BOTÃO PARA GERAR IMAGEM =====
            const btnContainer = document.createElement('div');
            btnContainer.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
                padding: 12px 20px;
                background: rgba(30, 22, 19, 0.95);
                border-radius: 16px;
                border: 1px solid rgba(212, 163, 115, 0.15);
                backdrop-filter: blur(10px);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            `;

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = '📥 Baixar Preview (1200x630)';
            downloadBtn.style.cssText = `
                padding: 10px 24px;
                background: linear-gradient(135deg, #d4a373, #b8884a);
                color: #1a1210;
                border: none;
                border-radius: 10px;
                font-family: 'Georgia', serif;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                letter-spacing: 0.5px;
            `;
            downloadBtn.onmouseover = function() {
                this.style.transform = 'scale(1.03)';
                this.style.boxShadow = '0 4px 20px rgba(212, 163, 115, 0.3)';
            };
            downloadBtn.onmouseout = function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = 'none';
            };
            downloadBtn.onclick = function() {
                // Carrega a biblioteca se necessário
                if (typeof html2canvas === 'undefined') {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    script.onload = function() {
                        generatePreview();
                    };
                    document.head.appendChild(script);
                } else {
                    generatePreview();
                }
            };

            const copyBtn = document.createElement('button');
            copyBtn.textContent = '📋 Copiar para área de transferência';
            copyBtn.style.cssText = `
                padding: 10px 24px;
                background: rgba(44, 24, 16, 0.8);
                color: rgba(212, 163, 115, 0.7);
                border: 1px solid rgba(212, 163, 115, 0.1);
                border-radius: 10px;
                font-family: 'Georgia', serif;
                font-size: 0.95rem;
                cursor: pointer;
                transition: all 0.3s;
                letter-spacing: 0.5px;
            `;
            copyBtn.onmouseover = function() {
                this.style.background = 'rgba(44, 24, 16, 1)';
                this.style.borderColor = 'rgba(212, 163, 115, 0.3)';
                this.style.color = 'rgba(212, 163, 115, 0.9)';
            };
            copyBtn.onmouseout = function() {
                this.style.background = 'rgba(44, 24, 16, 0.8)';
                this.style.borderColor = 'rgba(212, 163, 115, 0.1)';
                this.style.color = 'rgba(212, 163, 115, 0.7)';
            };
            copyBtn.onclick = function() {
                if (typeof html2canvas === 'undefined') {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    script.onload = function() {
                        copyToClipboard();
                    };
                    document.head.appendChild(script);
                } else {
                    copyToClipboard();
                }
            };

            function copyToClipboard() {
                const container = document.getElementById('previewImage');
                html2canvas(container, {
                    width: 1200,
                    height: 630,
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#0a0a0a',
                    allowTaint: true,
                    logging: false
                }).then(function(canvas) {
                    canvas.toBlob(function(blob) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        navigator.clipboard.write([item]).then(function() {
                            alert('✅ Imagem copiada para a área de transferência!');
                        }).catch(function() {
                            alert('❌ Erro ao copiar. Use o botão "Baixar" em vez disso.');
                        });
                    });
                });
            }

            // Adiciona um aviso para redimensionar a janela se necessário
            const warningMsg = document.createElement('p');
            warningMsg.textContent = '💡 Para melhor qualidade, use uma janela grande. A imagem será gerada em 1200x630.';
            warningMsg.style.cssText = `
                color: rgba(160, 128, 96, 0.4);
                font-size: 0.7rem;
                font-style: italic;
                width: 100%;
                text-align: center;
                margin: 4px 0 0;
                letter-spacing: 0.5px;
            `;

            btnContainer.appendChild(downloadBtn);
            btnContainer.appendChild(copyBtn);
            btnContainer.appendChild(warningMsg);
            document.body.appendChild(btnContainer);

            // ===== ADICIONA INSTRUÇÕES =====
            console.log('📖 Dom Casmurro - Gerador de Preview');
            console.log('🖼️ Clique no botão "Baixar Preview" para gerar a imagem 1200x630');
            console.log('📋 Use o botão "Copiar" para colar diretamente em redes sociais');
            console.log('');
            console.log('✅ Depois de baixar, renomeie o arquivo para "preview.jpg"');
            console.log('📁 Coloque na pasta "img/" do seu projeto');
        });
    </script>

    <!-- ===== CARREGA A BIBLIOTECA html2canvas ===== -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
</body>
  </html>
